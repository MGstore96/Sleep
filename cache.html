<!DOCTYPE html>
<html lang="id" manifest="Cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapse 2.0 PS4 by MGstore</title>
<link rel="stylesheet" href="apache.css">
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Logo MGstore" class="logo">
    </div>

    <div class="header-title">Lapse 2.0 PS4 by MGstore</div>
    <div class="cache-subtitle">OFFLINE CACHE</div>

    <div class="status-card">
        <div id="msgs">Memeriksa cache...</div>
        <div id="detail"></div>
        <div class="bar"><div id="fill"></div></div>
        <div id="percent">0%</div>
        <div class="cache-actions">
            <a id="back" href="index.html">Kembali ke Menu</a>
        </div>
    </div>

    <div class="thanks-section">
        <h3>TERIMA KASIH KEPADA:</h3>
        <div class="credits-list">
            <span class="credit-item">Karo Sharifi</span>
            <span class="credit-item">GamerHack93</span>
            <span class="credit-item">sleirsgoevy</span>
            <span class="credit-item">TheFlow</span>
            <span class="credit-item">Flatz</span>
            <span class="credit-item">Egycnq</span>
            <span class="credit-item">Jordy</span>
            <span class="credit-item">Sonic-Iso</span>
            <span class="credit-item">Abc</span>
            <span class="credit-item">Ufm42</span>
            <span class="credit-item">Prb29327239</span>
            <span class="credit-item">Feyzee61</span>
            <span class="credit-item">AlAzif</span>
            <span class="credit-item">ChendoChap</span>
            <span class="credit-item">Kameleonre_</span>
            <span class="credit-item">SiSTR0</span>
        </div>
    </div>
</div>

<footer>
    <p>&copy; MGstore Webkit Host</p>
</footer>

<script>
(function(){
    var app = window.applicationCache;
    var fill = document.getElementById("fill");
    var percent = document.getElementById("percent");
    var msgs = document.getElementById("msgs");
    var detail = document.getElementById("detail");
    var finished = false;
    var redirectTimer = null;

    function setStateClass(type) {
        msgs.className = "";
        fill.className = "";
        if (type === "success") {
            msgs.classList.add("success");
            fill.classList.add("done");
        } else if (type === "error") {
            msgs.classList.add("error");
            fill.classList.add("fail");
        }
    }

    function setProgress(p, msg, info, stateType) {
        p = Math.max(0, Math.min(100, p));
        if (fill) fill.style.width = p + "%";
        if (percent) percent.textContent = p + "%";
        if (msgs) msgs.textContent = msg;
        if (detail) detail.textContent = info || "";
        setStateClass(stateType || "");
    }

    function goIndex(msg, info) {
        if (finished) return;
        finished = true;
        setProgress(100, msg, info || "Membuka halaman utama...", "success");
        if (redirectTimer) clearTimeout(redirectTimer);
        redirectTimer = window.setTimeout(function(){
            window.location.replace("index.html");
        }, 1500);
    }

    if (!app) {
        setProgress(0, "Application Cache tidak didukung", "Browser tidak mendukung offline cache.", "error");
        return;
    }

    app.addEventListener("checking", function(){
        setProgress(5, "Memeriksa manifest cache...", "Mengecek pembaruan berkas");
    }, false);

    app.addEventListener("downloading", function(){
        setProgress(10, "Mengunduh cache offline...", "Menyimpan berkas ke memori browser");
    }, false);

    app.addEventListener("progress", function(e){
        var total = e.total || 0;
        var loaded = e.loaded || 0;
        var p = total ? Math.floor((loaded / total) * 100) : 15;
        setProgress(p, "Menyimpan cache: " + p + "%", loaded + " / " + total + " berkas", "");
    }, false);

    app.addEventListener("cached", function(){
        goIndex("Cache offline selesai — 100%", "Semua berkas sudah tersimpan untuk mode offline");
    }, false);

    app.addEventListener("updateready", function(){
        try { app.swapCache(); } catch (e) {}
        goIndex("Pembaruan cache selesai — 100%", "Versi cache terbaru siap digunakan");
    }, false);

    app.addEventListener("noupdate", function(){
        goIndex("Cache sudah terbaru — 100%", "Siap digunakan secara offline");
    }, false);

    app.addEventListener("error", function(){
        // Jika sudah ada cache tersimpan (IDLE atau UPDATEREADY), tetap bisa lanjut offline
        if (app.status === app.IDLE || app.status === app.UPDATEREADY) {
            goIndex("Menggunakan cache tersimpan — 100%", "Koneksi tidak tersedia; memakai cache lokal");
        } else {
            setProgress(0, "Gagal menyimpan cache offline", "Pastikan semua file di Cache.manifest ada (tidak 404) dan header manifest benar", "error");
        }
    }, false);

    app.addEventListener("obsolete", function(){
        setProgress(0, "Cache kedaluwarsa (obsolete)", "Muat ulang halaman untuk membuat cache baru", "error");
    }, false);

    // Cek status awal saat halaman dibuka
    if (window.location.search.indexOf("update=1") !== -1) {
        setProgress(5, "Memperbarui cache...", "Memeriksa berkas terbaru");
        window.setTimeout(function(){
            try { app.update(); }
            catch (e) { setProgress(0, "Gagal memperbarui cache", String(e), "error"); }
        }, 250);
    } else if (app.status === app.UPDATEREADY) {
        try { app.swapCache(); } catch (e) {}
        goIndex("Cache siap — 100%", "Memakai cache terbaru");
    } else if (app.status === app.IDLE && !navigator.onLine) {
        goIndex("Mode offline aktif — 100%", "Memuat dari cache lokal");
    }
})();
</script>
</body>
</html>
