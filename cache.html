<!DOCTYPE html>
<html lang="id" manifest="Cache.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lapse 2.0 PS4 by MGstore</title>
<link rel="stylesheet" href="apache.css">
</head>
<body>

<div class="container">
    <!-- Container Logo Tengah Atas -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo MGstore" class="logo">
    </div>

    <div class="header-title">Lapse 2.0 PS4 by MGstore</div>
    <div class="cache-subtitle">OFFLINE CACHE</div>

    <div class="status-card">
        <div id="msgs">Persiapan cache...</div>
        <div id="detail"></div>
        <div class="bar"><div id="fill"></div></div>
        <div id="percent">0%</div>
        <div class="cache-actions">
            <a id="back" href="index.html">Kembali ke Menu</a>
        </div>
    </div>

    <div class="thanks-section">
        <h3>TERIMA KASIH KEPADA:</h3>
        <div class="credits-list">
            <span class="credit-item">Karo Sharifi</span>
            <span class="credit-item">GamerHack93</span>
            <span class="credit-item">sleirsgoevy</span>
            <span class="credit-item">TheFlow</span>
            <span class="credit-item">Flatz</span>
            <span class="credit-item">Egycnq</span>
            <span class="credit-item">Jordy</span>
            <span class="credit-item">Sonic-Iso</span>
            <span class="credit-item">Abc</span>
            <span class="credit-item">Ufm42</span>
            <span class="credit-item">Prb29327239</span>
            <span class="credit-item">Feyzee61</span>
            <span class="credit-item">AlAzif</span>
            <span class="credit-item">ChendoChap</span>
            <span class="credit-item">Kameleonre_</span>
            <span class="credit-item">SiSTR0</span>
        </div>
    </div>
</div>

<footer>
    <p>&copy; MGstore Webkit Host</p>
</footer>

<script>
(function(){
    var app = window.applicationCache;
    var fill = document.getElementById("fill");
    var percent = document.getElementById("percent");
    var msgs = document.getElementById("msgs");
    var detail = document.getElementById("detail");
    var finished = false;

    function setStateClass(type) {
        msgs.className = "";
        fill.className = "";
        if (type === "success") {
            msgs.classList.add("success");
            fill.classList.add("done");
        } else if (type === "error") {
            msgs.classList.add("error");
            fill.classList.add("fail");
        }
    }

    function setProgress(p, msg, info, stateType) {
        p = Math.max(0, Math.min(100, p));
        fill.style.width = p + "%";
        percent.textContent = p + "%";
        msgs.textContent = msg;
        detail.textContent = info || "";
        setStateClass(stateType || "");
    }

    function finish(msg, info) {
        if (finished) return;
        finished = true;
        setProgress(100, msg, info || "Opening Wobkot PS4...", "success");
        window.setTimeout(function(){ window.location.replace("index.html"); }, 650);
    }

    if (!app) {
        setProgress(0, "Application Cache unavailable", "This browser does not support the host cache.", "error");
        return;
    }

    app.addEventListener("checking", function(){
        setProgress(0, "Checking Wobkot PS4 cache...", "Checking the manifest version");
    }, false);

    app.addEventListener("downloading", function(){
        setProgress(0, "Caching Wobkot PS4 files...", "Downloading required host files");
    }, false);

    app.addEventListener("progress", function(e){
        var total = e.total || 0;
        var loaded = e.loaded || 0;
        var p = total ? Math.floor((loaded / total) * 100) : 0;
        setProgress(p, "Caching: " + p + "%", loaded + " / " + total + " resources");
    }, false);

    app.addEventListener("cached", function(){
        finish("Cache complete — 100%", "All Wobkot PS4 files are cached");
    }, false);

    app.addEventListener("updateready", function(){
        try { app.swapCache(); } catch (e) {}
        finish("Cache update complete — 100%", "The new host version is ready");
    }, false);

    app.addEventListener("noupdate", function(){
        finish("Wobkot PS4 cache is up to date — 100%", "No new version is available");
    }, false);

    app.addEventListener("error", function(){
        if (app.status !== app.UNCACHED) {
            finish("Using existing Wobkot PS4 cache", "Update unavailable; continuing with the saved version");
        } else {
            setProgress(0, "Cache download failed", "Check the host connection and reload this page", "error");
        }
    }, false);

    app.addEventListener("obsolete", function(){
        setProgress(0, "Cache is obsolete", "Reload the host to create a fresh cache", "error");
    }, false);

    if (window.location.search.indexOf("update=1") !== -1) {
        setProgress(0, "Updating Wobkot PS4 cache...", "Checking for updated files");
        window.setTimeout(function(){
            try { app.update(); }
            catch (e) { setProgress(0, "Cache update failed", String(e), "error"); }
        }, 300);
    } else if (app.status === app.IDLE) {
        finish("Wobkot PS4 cache is ready — 100%", "Using the saved host files");
    } else if (app.status === app.UPDATEREADY) {
        try { app.swapCache(); } catch (e) {}
        finish("Cache update complete — 100%", "The new host version is ready");
    }
})();
</script>
</body>
</html>
