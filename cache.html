<!DOCTYPE html>
<html lang="en" manifest="Cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lapse 2.0 PS4 by MGstore</title>
<style>
  :root {
    --bg-base: #060913;
    --ps-blue: #0070d1;
    --ps-cyan: #00d2ff;
    --ps-glow: rgba(0, 112, 209, 0.35);
    --card-bg: rgba(14, 20, 36, 0.72);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-base);
    background-image:
      radial-gradient(circle at 15% 15%, rgba(0, 112, 209, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(0, 210, 255, 0.14) 0%, transparent 45%),
      linear-gradient(180deg, #070b17 0%, #04060d 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  /* Grid halus ala HUD konsol */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Kartu Cache Utama */
  #cache-box {
    position: relative;
    z-index: 2;
    width: min(720px, 92vw);
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 2.25rem 2rem;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.72),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  /* Garis aksen neon di bagian atas kartu */
  #cache-box::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ps-cyan), var(--ps-blue), transparent);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 999px;
    background: rgba(0, 112, 209, 0.18);
    border: 1px solid rgba(0, 210, 255, 0.35);
    color: var(--ps-cyan);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 0.85rem;
    box-shadow: 0 0 20px rgba(0, 112, 209, 0.25);
  }

  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ps-cyan);
    box-shadow: 0 0 8px var(--ps-cyan);
    animation: pulse 1.6s infinite ease-in-out;
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(1.75rem, 4.5vw, 2.55rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 30%, #7dd3fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  #subtitle {
    margin: 0 0 28px;
    color: var(--text-muted);
    font-size: 0.92rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  #status {
    font-size: 1.15rem;
    font-weight: 700;
    color: #e0f2fe;
    margin-bottom: 8px;
  }

  #detail {
    min-height: 22px;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  /* Progress Bar Modern */
  .bar {
    width: 100%;
    height: 20px;
    margin-top: 22px;
    padding: 2px;
    background: rgba(6, 10, 20, 0.78);
    border: 1px solid rgba(0, 210, 255, 0.22);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
  }

  #fill {
    width: 0%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--ps-blue), var(--ps-cyan));
    box-shadow: 0 0 16px rgba(0, 210, 255, 0.55);
    transition: width 0.18s ease-out;
  }

  #percent {
    margin-top: 12px;
    color: var(--ps-cyan);
    font-size: 1.05rem;
    font-weight: 800;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    letter-spacing: 0.5px;
  }

  /* Tombol Kembali */
  #back {
    margin-top: 26px;
    display: inline-block;
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid rgba(0, 210, 255, 0.35);
    background: rgba(0, 112, 209, 0.22);
    color: #ffffff;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  #back:hover, #back:focus {
    outline: none;
    background: rgba(0, 112, 209, 0.42);
    border-color: var(--ps-cyan);
    box-shadow: 0 0 18px var(--ps-glow);
    transform: translateY(-1px);
  }

  /* Simbol PlayStation Dekoratif */
  .ps-symbols {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1.5rem;
    color: rgba(148, 163, 184, 0.35);
    font-size: 0.95rem;
    user-select: none;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
</style>
</head>
<body>
<div id="cache-box">
    <div class="badge"><span class="dot"></span> Offline Cache Manager</div>
    <h1>Lapse 2.0 PS4 by MGstore</h1>
    <p id="subtitle">Cache</p>
    <div id="status">Preparing cache...</div>
    <div id="detail"></div>
    <div class="bar"><div id="fill"></div></div>
    <div id="percent">0%</div>
    <a id="back" href="index.html">Back to Menu</a>
    <div class="ps-symbols">
      <span>△</span>
      <span>○</span>
      <span>✕</span>
      <span>□</span>
    </div>
</div>

<script>
(function(){
    var app = window.applicationCache;
    var fill = document.getElementById("fill");
    var percent = document.getElementById("percent");
    var status = document.getElementById("status");
    var detail = document.getElementById("detail");
    var finished = false;

    function setProgress(p, msg, info) {
        p = Math.max(0, Math.min(100, p));
        fill.style.width = p + "%";
        percent.textContent = p + "%";
        status.textContent = msg;
        detail.textContent = info || "";
    }

    function finish(msg, info) {
        if (finished) return;
        finished = true;
        setProgress(100, msg, info || "Opening Wobkot PS4...");
        window.setTimeout(function(){ window.location.replace("index.html"); }, 650);
    }

    if (!app) {
        setProgress(0, "Application Cache unavailable", "This browser does not support the host cache.");
        return;
    }

    app.addEventListener("checking", function(){
        setProgress(0, "Checking Wobkot PS4 cache...", "Checking the manifest version");
    }, false);

    app.addEventListener("downloading", function(){
        setProgress(0, "Caching Wobkot PS4 files...", "Downloading required host files");
    }, false);

    app.addEventListener("progress", function(e){
        var total = e.total || 0;
        var loaded = e.loaded || 0;
        var p = total ? Math.floor((loaded / total) * 100) : 0;
        setProgress(p, "Caching: " + p + "%", loaded + " / " + total + " resources");
    }, false);

    app.addEventListener("cached", function(){
        finish("Cache complete — 100%", "All Wobkot PS4 files are cached");
    }, false);

    app.addEventListener("updateready", function(){
        try { app.swapCache(); } catch (e) {}
        finish("Cache update complete — 100%", "The new host version is ready");
    }, false);

    app.addEventListener("noupdate", function(){
        finish("Wobkot PS4 cache is up to date — 100%", "No new version is available");
    }, false);

    app.addEventListener("error", function(){
        if (app.status !== app.UNCACHED) {
            finish("Using existing Wobkot PS4 cache", "Update unavailable; continuing with the saved version");
        } else {
            setProgress(0, "Cache download failed", "Check the host connection and reload this page");
        }
    }, false);

    app.addEventListener("obsolete", function(){
        setProgress(0, "Cache is obsolete", "Reload the host to create a fresh cache");
    }, false);

    if (window.location.search.indexOf("update=1") !== -1) {
        setProgress(0, "Updating Wobkot PS4 cache...", "Checking for updated files");
        window.setTimeout(function(){
            try { app.update(); }
            catch (e) { setProgress(0, "Cache update failed", String(e)); }
        }, 300);
    } else if (app.status === app.IDLE) {
        finish("Wobkot PS4 cache is ready — 100%", "Using the saved host files");
    } else if (app.status === app.UPDATEREADY) {
        try { app.swapCache(); } catch (e) {}
        finish("Cache update complete — 100%", "The new host version is ready");
    }
})();
</script>
</body>
</html>
